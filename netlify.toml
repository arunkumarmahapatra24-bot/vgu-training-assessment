[build]
  publish = "public"
  command = ""

# QR links look like https://<site>/t/ABC123 and open the participant page
[[redirects]]
  from = "/t/*"
  to = "/take.html"
  status = 200

# Certificate check links look like https://<site>/v/CERTCODE
[[redirects]]
  from = "/v/*"
  to = "/verify.html"
  status = 200
